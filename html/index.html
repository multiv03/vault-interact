<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vault-interact</title>
<!-- Los iconos de las opciones (los mismos nombres que en ox_target: 'fa-solid fa-car'). -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
<link rel="stylesheet" href="etiqueta.css">
</head>
<body>
<!-- Los indicadores: un punto pequeño sobre cada cosa con la que se puede interactuar. -->
<div id="puntos"></div>
<!-- La etiqueta flotante: un punto sobre lo que miras, el nombre (con cantidad
     y precio si los hay), una línea debajo y las teclas, o el menú de opciones.
     Con ?demo (o ?demo=menu) se ve en un navegador normal. -->
<div id="etiqueta" class="etiqueta oculto">
  <span class="et-punto"></span>
  <div class="et-col">
    <div class="et-pildora"><b class="et-titulo"></b><span class="et-cant"></span><span class="et-precio oculto"></span></div>
    <div class="et-sub oculto"></div>
    <div class="et-teclas"></div>
    <div class="et-ayuda oculto"></div>
  </div>
</div>
<script src="etiqueta.js"></script>
</body>
</html>
